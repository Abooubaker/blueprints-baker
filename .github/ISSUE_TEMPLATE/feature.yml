name: Feature request
description: Propose a new capability or a meaningful improvement
title: "feat: "
labels: ["enhancement", "status:ready"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Describe the problem first, then the smallest useful
        solution. Check the roadmap and open issues to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve? Who experiences it?
      placeholder: As a beginner building a line follower, I cannot tell whether two parts are compatible...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that make this issue done.
      placeholder: |
        - [ ] The API returns ...
        - [ ] The UI shows ...
        - [ ] Tests cover ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Development area
      options:
        - Frontend
        - Backend
        - AI agents
        - Database
        - DevOps
        - Documentation
        - Design
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, tradeoffs, or workarounds.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, related issues, dependencies.
