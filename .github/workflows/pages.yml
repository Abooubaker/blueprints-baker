name: Demo site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The fixtures are real output from the deterministic electrical engine.
      # They cannot import app code, so install the API dependencies first.
      - run: uv sync --locked
        working-directory: apps/api

      - name: Generate demo fixtures
        run: uv run python ../../scripts/generate_demo_data.py
        working-directory: apps/api

      # Derive the path without requiring Pages to be enabled yet, so the
      # static build still validates on repositories without Pages access.
      - name: Compute Pages base path
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
        working-directory: apps/web

      - name: Build static export
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          # Never point the public demo at a live API or inject credentials.
          NEXT_PUBLIC_API_URL: ""

      - name: Scan tracked files and export for credentials
        run: bash scripts/scan_secrets.sh

      # Private repositories need a GitHub plan that includes Pages, and Pages
      # must be enabled with "Source: GitHub Actions" before deployment works.
      - name: Check Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages is not enabled::The static export was built but not deployed. Make the repository public (or use a plan with Pages for private repositories), then enable Settings -> Pages -> Source: GitHub Actions."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
