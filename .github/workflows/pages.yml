name: Demo site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The fixtures are real output from the deterministic electrical engine.
      # They cannot import app code, so install the API dependencies first.
      - run: uv sync --locked
        working-directory: apps/api

      - name: Generate demo fixtures
        run: uv run python ../../scripts/generate_demo_data.py
        working-directory: apps/api

      - name: Resolve Pages base path
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
        working-directory: apps/web

      - name: Build static export
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEMO_MODE: "true"
          # Project sites are served from /<repository>. configure-pages
          # returns an empty string for user/organisation sites.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Never point the public demo at a live API or inject credentials.
          NEXT_PUBLIC_API_URL: ""

      - name: Scan tracked files and export for credentials
        run: bash scripts/scan_secrets.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
