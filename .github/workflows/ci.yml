name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy app
      - name: pytest
        run: uv run pytest --cov=app --cov-report=term-missing

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blueprints
          POSTGRES_PASSWORD: blueprints
          POSTGRES_DB: blueprints
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueprints -d blueprints"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://blueprints:blueprints@localhost:5432/blueprints
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - name: Upgrade to head
        run: uv run alembic upgrade head
      - name: Verify models match migrations
        run: uv run alembic check
      - name: Verify downgrade and re-upgrade
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  contracts:
    name: Generated contracts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - name: Regenerate contracts
        run: make contracts
      - name: Fail on drift
        run: git diff --exit-code

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  demo:
    name: Static demo build (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked
        working-directory: apps/api
      - name: Regenerate demo fixtures
        run: uv run python ../../scripts/generate_demo_data.py
        working-directory: apps/api
      - name: Fail on fixture drift
        run: git diff --exit-code -- apps/web/src/lib/demo apps/web/public/demo
      - run: npm ci
        working-directory: apps/web
      - name: Build static export
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: /blueprints-baker
          NEXT_PUBLIC_API_URL: ""
      - name: Scan for credential-shaped strings
        run: bash scripts/scan_secrets.sh
